name: Port plan validation

on:
  push:
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/port-plan-check.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/port-plan-check.yml"
  workflow_dispatch:

jobs:
  validate-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project plan exists
        run: test -s docs/PORTING_PLAN.md
      - name: Check plan has milestones and evidence rules
        run: |
          grep -q "Milestone sequence" docs/PORTING_PLAN.md
          grep -q "Current verified status" docs/PORTING_PLAN.md
          grep -q "Tested" docs/PORTING_PLAN.md
